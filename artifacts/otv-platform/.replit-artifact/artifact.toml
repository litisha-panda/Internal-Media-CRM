kind = "web"
previewPath = "/"
title = "OTV Internal Platform"
version = "1.0.0"
id = "artifacts/otv-platform"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18842

[services.development]
run = "pnpm --filter @workspace/otv-platform run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/otv-platform", "run", "build" ]
publicDir = "artifacts/otv-platform/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18842"
BASE_PATH = "/"
